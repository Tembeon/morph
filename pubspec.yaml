name: morph
description: "iOS 27 Liquid Glass controls for Flutter with motion measured on the iPhone: tab bar, glass buttons, menus, sheets, alerts, bars and more, in liquid or flat glass."
version: 0.8.4
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.0"

dependencies:
  # hook/build.dart reads the target OS to compile only its runtime stages.
  code_assets: '>=1.2.1 <3.0.0'
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.0.2
  meta: ^1.16.0

dev_dependencies:
  material_ui: ^1.1.0
  # Keep semantic snapshots reproducible; updates require API baseline review.
  analyzer: 10.2.0
  benchmark_harness: ^2.2.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The liquid glass final pass is not listed here: hook/build.dart compiles
  # its variants (lib/src/glass/renderer/liquid_shader_variants.dart) into
  # build/shaderbundles/*.iplr, next to the Flutter GPU bundle, and creates
  # the directory on every build.
  shaders:
    - lib/src/glass/renderer/shaders/glass_shadow.frag
    - lib/src/widgets/shaders/glyph_blur.frag
    - lib/src/widgets/shaders/glyph_reduce.frag
    - lib/src/glass/renderer/shaders/flat_fused_body.frag
  assets:
    - build/shaderbundles/
