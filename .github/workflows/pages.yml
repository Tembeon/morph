name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      # morph's glass renderer compiles its liquid shaders to stubs on the
      # web and draws frosted glass there, so the gallery builds as is.
      - name: Build the example (wasm)
        run: flutter build web --release --wasm --base-href /morph/
        working-directory: example
      # API docs ride the same site at /morph/docs/ - the package is
      # not on pub.dev, so this is the only hosted dartdoc.
      - name: Generate API docs
        run: |
          flutter pub get
          dart doc
          mv doc/api example/build/web/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  # Skipped while the repo is private (Pages needs a public repo on
  # the free plan); the build job doubles as a wasm CI check. The
  # Pages site itself was created once via the API - GITHUB_TOKEN
  # cannot create it (no admin scope), only deploy to it.
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
