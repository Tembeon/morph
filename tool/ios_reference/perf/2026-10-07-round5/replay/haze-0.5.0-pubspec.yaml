name: haze
description: "Progressive (gradient) blur for Flutter: a true variable-radius Gaussian that fades from any edge, with an optional matching tint wash."
version: 0.5.0
homepage: https://herme.se
repository: https://github.com/ru-ji/haze

environment:
  sdk: ^3.10.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/haze.frag
