buffers { size_kb: 65536 fill_policy: RING_BUFFER }
buffers { size_kb: 8192 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.perf"
    target_buffer: 0
    perf_event_config {
      timebase {
        counter: SW_CPU_CLOCK
        frequency: 100
        timestamp_clock: PERF_CLOCK_MONOTONIC
      }
      callstack_sampling {
        scope { target_cmdline: "dev.tembeon.morph_example" }
        kernel_frames: false
      }
    }
  }
}
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      atrace_categories: "view"
      atrace_apps: "dev.tembeon.morph_example"
      buffer_size_kb: 8192
      drain_period_ms: 250
    }
  }
}
data_sources { config { name: "android.surfaceflinger.frametimeline" target_buffer: 1 } }
data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config { scan_all_processes_on_start: true }
  }
}
write_into_file: true
file_write_period_ms: 2000
duration_ms: 900000
flush_period_ms: 5000
